# CI for acidity-lstm (MLOPS.md phase M1; decision D5: Azure DevOps Pipelines).
#
# Lint, unit tests, then a wheel. The integration tests need the real Equity
# Silver data, which is gitignored and never reaches CI, so they are
# deselected here and run where the data lives: locally and on Databricks
# (DEVIATIONS.md D-34).
#
# The code lives in Azure Repos. `trigger` runs CI on every push to main.
# Azure Repos ignores YAML `pr` triggers, so pull requests into main are
# validated by a build-validation branch policy that points at this pipeline
# (MLOPS.md, "M1: Azure DevOps setup").

trigger:
  branches:
    include: [main]

parameters:
  - name: agent
    displayName: Build agent
    type: string
    default: self-hosted
    values: [self-hosted, microsoft-hosted]

# self-hosted: the Default pool, an agent on the development PC (MLOPS.md D5).
pool:
  ${{ if eq(parameters.agent, 'self-hosted') }}:
    name: Default
  ${{ else }}:
    vmImage: ubuntu-latest

variables:
  PYTHON_VERSION: "3.12"
  # CPU-only PyTorch. The default Linux wheel pulls about 2.5 GB of CUDA.
  TORCH_INDEX: https://download.pytorch.org/whl/cpu
  # A fresh environment per run, outside the checkout so ruff never lints it.
  VENV: $(Agent.TempDirectory)/ci-venv

steps:
  # Microsoft-hosted agents have Python in their tool cache but not uv. The
  # development PC has uv on PATH but its `python` is an unrelated
  # environment without pip, so both routes build the venv with uv.
  - ${{ if eq(parameters.agent, 'microsoft-hosted') }}:
      - task: UsePythonVersion@0
        displayName: Python $(PYTHON_VERSION)
        inputs:
          versionSpec: $(PYTHON_VERSION)
      - script: python -m pip install uv==0.11.15
        displayName: Install uv

  - script: uv venv "$(VENV)" --python $(PYTHON_VERSION) --seed
    displayName: Create a clean Python $(PYTHON_VERSION) environment

  # Quoted: in YAML an unquoted ' #' starts a comment.
  - script: 'echo ##vso[task.setvariable variable=PY]$(VENV)\Scripts\python.exe'
    displayName: Locate Python (Windows)
    condition: eq(variables['Agent.OS'], 'Windows_NT')

  - script: 'echo "##vso[task.setvariable variable=PY]$(VENV)/bin/python"'
    displayName: Locate Python (Linux)
    condition: ne(variables['Agent.OS'], 'Windows_NT')

  - script: "\"$(PY)\" -m pip install torch==2.6.0 --index-url $(TORCH_INDEX)"
    displayName: Install PyTorch (CPU)

  - script: "\"$(PY)\" -m pip install -r requirements-dev.txt"
    displayName: Install pinned dependencies

  - script: "\"$(PY)\" -m pip install -e . --no-deps"
    displayName: Install acidity-lstm

  - script: "\"$(PY)\" -m ruff check . --output-format azure"
    displayName: Lint

  - script: "\"$(PY)\" -m pytest -m \"not integration\" --junitxml=$(Build.ArtifactStagingDirectory)/test-results.xml"
    displayName: Unit tests

  - task: PublishTestResults@2
    displayName: Publish test results
    condition: succeededOrFailed()
    inputs:
      testResultsFiles: $(Build.ArtifactStagingDirectory)/test-results.xml
      testRunTitle: Unit tests, Python $(PYTHON_VERSION), $(Agent.OS)

  - script: "\"$(PY)\" -m pip wheel . --no-deps --wheel-dir $(Build.ArtifactStagingDirectory)/dist"
    displayName: Build wheel

  - task: PublishPipelineArtifact@1
    displayName: Publish wheel
    inputs:
      targetPath: $(Build.ArtifactStagingDirectory)/dist
      artifact: wheel
