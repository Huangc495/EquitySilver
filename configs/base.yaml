# Configuration for the Ma et al. (2021) LSTM acidity-weather replication.
# Every hyperparameter and modelling choice lives here. Deviations from the
# paper are recorded in DEVIATIONS.md.

paths:
  local:
    # Weather: one Environment Canada daily CSV per year (glob, relative to repo root).
    weather_glob: data/raw/en_climate_daily_BC_1072692_*_P1D.csv
    acidity_excel: data/raw/2017 ARD Chemisty_Clean.xlsx
    processed_dir: data/processed
    reports_dir: reports
  databricks:
    # Unity Catalog volumes: /Volumes/<catalog>/<schema>/<volume>/<path>.
    # Catalog equity_silver_databricks_mlops, schema default (auto-created),
    # with `raw` and `processed` as two volumes. See docs/README.md for the
    # DDL and the upload step.
    weather_glob: /Volumes/equity_silver_databricks_mlops/default/raw/en_climate_daily_BC_1072692_*_P1D.csv
    acidity_excel: /Volumes/equity_silver_databricks_mlops/default/raw/2017 ARD Chemisty_Clean.xlsx
    processed_dir: /Volumes/equity_silver_databricks_mlops/default/processed
    # Not the repo: on the cluster that is a Git folder, and writing tracked
    # files there would make later pulls conflict (DEVIATIONS.md D-32).
    reports_dir: /Volumes/equity_silver_databricks_mlops/default/processed/reports

compute:
  # The workspace has no classic compute plane, so everything runs on
  # serverless (DEVIATIONS.md D-33). Environment 4 is Python 3.12.3; the
  # packages it lacks come from the requirements file below.
  serverless_environment_version: "4"
  requirements: requirements-databricks.txt

mlflow:
  local_tracking_uri: file:./mlruns
  local_experiment: equity-silver-lstm
  # Workspace: Equity-Silver-Databricks-MLOps (Azure Databricks).
  # ${VAR} is expanded from the environment at load time and errors if unset,
  # so no personal identifier is stored in this public repo. Set it on the
  # cluster: Compute > Edit > Advanced options > Spark > Environment variables.
  databricks_experiment: /Users/${DATABRICKS_USERNAME}/equity-silver-lstm

data:
  weather_start: 1997-01-01
  weather_end: 2017-12-31
  acidity_start: 1998-01-01
  acidity_end: 2017-12-31
  stations: [BD, C7]
  # Sheet name in the acidity workbook -> station code.
  acidity_sheets:
    Bessmemer Dump: BD
    C-7: C7
  same_day_duplicates: mean        # mean | keep
  # Environment Canada quality flags.
  trace_precip_as_zero: true       # flag "T" -> 0.0 mm
  missing_flag_as_nan: true        # flag "M" -> NaN

windows:
  n_steps: 10
  types: [A, B]
  common_sample_set: false         # true = run Type A only on samples surviving Type B
  time_tag: per_step               # per_step | constant
  time_tag_origin: 1998-01-01      # day 1

scaling:
  fit_on: all                      # all (paper) | train
  ddof: 0                          # population std

model:
  hidden_sizes: [5, 10, 20]
  output_activation: linear        # linear | sigmoid (Eq. 7 as printed)
  init: matlab                     # matlab | torch_default
  freeze_bias_hh: false
  fc_baseline_hidden: 10
  fc_baseline_activation: tanh

train:
  lr: 0.005
  momentum: 0.9
  weight_decay: 1.0e-4             # MATLAB default L2Regularization
  lr_drop_period: 125
  lr_drop_factor: 0.2
  batch_size: 20
  drop_last: true                  # MATLAB discards the incomplete final mini-batch
  shuffle: once                    # once (MATLAB default) | every_epoch
  max_epochs: 200
  patience: 6
  restore_best: false              # MATLAB returns the last-iteration network
  n_repeats: 5
  base_seed: 42

split:
  method: random                   # random (paper) | blocked
  fractions: [0.70, 0.15, 0.15]
  resplit_each_repeat: false

forecast:
  station: BD
  train_years: [1999, 2014]
  predict_years: [2015, 2016]
  fractions: [0.80, 0.20]
  scaler_fit_on: train_period

sensitivity:
  factors: [0.8, 1.2]
  variables: [precip, tmean]

# Production models (MLOPS.md phase M2; decision D3). One registered model per
# station; the champion and the shadow challenger are versions of it,
# told apart by alias.
registry:
  catalog: equity_silver_databricks_mlops    # Unity Catalog, on Databricks
  schema: default
  model_name: "acidity_{station}"            # station lower-cased: acidity_bd
  variant: paper                             # the training recipe (experiments.VARIANTS)
  roles:
    champion:
      window_type: B
      hidden_size: 10
      time_tag: none
    challenger:
      window_type: B
      hidden_size: 10
      time_tag: per_step
  # Schema per environment (MLOPS.md D8): the Asset Bundle target passes
  # dev, staging or prod; `schema` above is the fallback.
  environments: [dev, staging, prod]
  # What a fresh environment needs to load the model. CPU-only torch: the
  # default Linux wheel pulls about 2.5 GB of CUDA.
  pip_requirements:
    - "--extra-index-url https://download.pytorch.org/whl/cpu"
    - "torch==2.6.0+cpu"
    - "numpy==2.1.3"
    - "pandas==2.2.3"
    - "PyYAML==6.0.2"

# Promotion gate (MLOPS.md M3; decisions D9, D10). Recipes are compared by
# blocked cross-validation by year; the winner is refit on every year.
gate:
  n_folds: 5                   # eligible years dealt into folds, each held out once
  val_years: 2                 # early-stopping years, drawn from the rest per fold
  n_seeds: 5                   # networks per recipe
  selection: ensemble          # ensemble (D10) | best_train_val (the paper's best-of-n)
  min_r: 0.2                   # floor on out-of-fold R, incumbent or not
  rmse_tolerance_mgL: 0.0      # candidate may not exceed the incumbent's RMSE by more
  max_r_drop: 0.0              # candidate may not trail the incumbent's R by more
